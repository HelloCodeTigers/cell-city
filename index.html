<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#6a3dcf">
<meta name="description" content="Cell City by CodeTigers: interactive 3D biology lessons in English and Hindi.">
<title>Cell City</title>
<style>
@font-face{font-family:"Mukta";src:url("fonts/mukta-devanagari-400-normal.woff2") format("woff2");font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:"Mukta";src:url("fonts/mukta-devanagari-600-normal.woff2") format("woff2");font-weight:600;font-style:normal;font-display:swap}
@font-face{font-family:"Mukta";src:url("fonts/mukta-devanagari-800-normal.woff2") format("woff2");font-weight:800;font-style:normal;font-display:swap}
@font-face{font-family:"Bricolage Grotesque";src:url("fonts/bricolage-grotesque-latin-600-normal.woff2") format("woff2");font-weight:600;font-style:normal;font-display:swap}
@font-face{font-family:"Bricolage Grotesque";src:url("fonts/bricolage-grotesque-latin-800-normal.woff2") format("woff2");font-weight:800;font-style:normal;font-display:swap}
@font-face{font-family:"Atkinson Hyperlegible";src:url("fonts/atkinson-hyperlegible-latin-400-normal.woff2") format("woff2");font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:"Atkinson Hyperlegible";src:url("fonts/atkinson-hyperlegible-latin-700-normal.woff2") format("woff2");font-weight:700;font-style:normal;font-display:swap}
@font-face{font-family:"Atkinson Hyperlegible";src:url("fonts/atkinson-hyperlegible-latin-400-italic.woff2") format("woff2");font-weight:400;font-style:italic;font-display:swap}
@font-face{font-family:"IBM Plex Mono";src:url("fonts/ibm-plex-mono-latin-500-normal.woff2") format("woff2");font-weight:500;font-style:normal;font-display:swap}
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
</style>
<style>
/* Layout: a microscope stage (live 3D cell) on the left, a lesson notebook on the right, a chapter film-strip below */
:root{
  --bg:#f3edf3; --surface:#fffbfe; --surface-2:#f6eef5; --ink:#251b30; --muted:#6a5d76; --line:#e2d4e0;
  --accent:#6a3dcf; --accent-ink:#ffffff; --accent-soft:#eee6fc; --stain:#c93a6a; --good:#1d8a62; --on-good:#ffffff; --bad:#c2410c;
  --stage-a:#fffafd; --stage-b:#e9dbea; --graticule:rgba(106,61,207,.075); --tag-bg:#251b30; --tag-fg:#fffbfe; --star:#f2b630;
  --shadow:0 1px 2px rgba(37,27,48,.06),0 10px 30px rgba(37,27,48,.10);
  --f-display:"Bricolage Grotesque","Mukta","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible","Mukta",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono","Mukta",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0a0e16; --surface:#111726; --surface-2:#172036; --ink:#e8edf8; --muted:#97a2ba; --line:#232e47;
    --accent:#a08cff; --accent-ink:#140d2c; --accent-soft:#1f1a3d; --stain:#ff7aa3; --good:#3ccf97; --on-good:#06251a; --bad:#ff8a5c;
    --stage-a:#182035; --stage-b:#05080e; --graticule:rgba(160,140,255,.06); --tag-bg:#e8edf8; --tag-fg:#0a0e16; --star:#f5c142;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.45);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
    --bg:#0a0e16; --surface:#111726; --surface-2:#172036; --ink:#e8edf8; --muted:#97a2ba; --line:#232e47;
    --accent:#a08cff; --accent-ink:#140d2c; --accent-soft:#1f1a3d; --stain:#ff7aa3; --good:#3ccf97; --on-good:#06251a; --bad:#ff8a5c;
    --stage-a:#182035; --stage-b:#05080e; --graticule:rgba(160,140,255,.06); --tag-bg:#e8edf8; --tag-fg:#0a0e16; --star:#f5c142;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.45);
    color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px;}
button{font:inherit;color:inherit}
button:focus-visible,.st:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
html[lang="hi"] body{line-height:1.6}

.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:12px;max-width:1520px;margin:0 auto}

/* top bar */
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;position:relative}
.brand{display:flex;align-items:center;gap:12px;margin-right:auto;min-width:0}
.brand svg{flex:0 0 auto}
.brand h1{font-family:var(--f-display);font-weight:800;font-size:28px;letter-spacing:-.03em;margin:0;line-height:1;white-space:nowrap}
html[lang="hi"] .brand h1{letter-spacing:0;line-height:1.15}
.brand small{display:block;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.16em;color:var(--muted);text-transform:uppercase;margin-top:5px}
.lang{display:inline-flex;background:var(--surface);border:1.5px solid var(--accent);border-radius:999px;padding:3px;gap:2px;flex:0 0 auto}
.lang button{border:0;background:transparent;border-radius:999px;padding:4px 11px;font-weight:700;font-size:13px;cursor:pointer;color:var(--accent);line-height:1.3;min-width:40px}
.lang button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.lessonBtn{display:inline-flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 14px;cursor:pointer;font-weight:700;font-size:14px}
.lessonBtn:hover{background:var(--surface-2)}
.menu{position:absolute;top:calc(100% + 8px);right:0;z-index:30;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:8px;width:min(340px,100%);display:grid;gap:6px}
.menu button{display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px;align-items:center;text-align:left;border:1px solid transparent;background:transparent;border-radius:12px;padding:10px;cursor:pointer}
.menu button:hover{background:var(--surface-2)}
.menu button[aria-current="true"]{border-color:var(--accent);background:var(--accent-soft)}
.menu .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--surface-2);color:var(--accent)}
.menu .n{font-family:var(--f-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.menu .nm{font-family:var(--f-display);font-weight:800;font-size:16px;line-height:1.2}
.menu .d{font-size:12.5px;color:var(--muted)}
.ctrls{display:flex;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px}
.ib{width:36px;height:36px;border-radius:50%;border:0;background:transparent;display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.ib:hover{background:var(--surface-2)}
.ib.primary{background:var(--accent);color:var(--accent-ink)}
.ib.speed{width:auto;padding:0 12px;border-radius:999px;font-family:var(--f-mono);font-size:12px;font-variant-numeric:tabular-nums}
.prog{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px 14px;min-width:220px}
.prog .lbl{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;gap:12px}
.prog .lbl b{color:var(--ink);font-weight:500;font-variant-numeric:tabular-nums}
.prog .grow{flex:1;min-width:0}
.bar{height:6px;background:var(--surface-2);border-radius:6px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--accent);width:0;border-radius:6px;transition:width .6s cubic-bezier(.2,.8,.2,1)}

/* stage */
.stage{display:grid;grid-template-columns:minmax(0,1fr) 384px;gap:12px;min-height:0}
.viewport{position:relative;border-radius:22px;overflow:hidden;border:1px solid var(--line);
  background:radial-gradient(110% 90% at 46% 42%,var(--stage-a),var(--stage-b));min-height:0}
.viewport::before{content:"";position:absolute;inset:0;pointer-events:none;
  background-image:linear-gradient(var(--graticule) 1px,transparent 1px),linear-gradient(90deg,var(--graticule) 1px,transparent 1px);background-size:44px 44px;
  -webkit-mask-image:radial-gradient(closest-side,#000 55%,transparent);mask-image:radial-gradient(closest-side,#000 55%,transparent)}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
#leader{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
#leader line{stroke:var(--tag-bg);stroke-width:1.5}
#leader .core{fill:var(--tag-bg)}
#leader .ring{fill:none;stroke:var(--tag-bg);stroke-width:1.5;transform-box:fill-box;transform-origin:center;animation:ping 1.8s ease-out infinite}
@keyframes ping{from{transform:scale(.6);opacity:.9}to{transform:scale(2.4);opacity:0}}
.tag{position:absolute;left:0;top:0;background:var(--tag-bg);color:var(--tag-fg);padding:7px 12px 8px;border-radius:9px;pointer-events:none;white-space:nowrap;
  font-family:var(--f-display);font-weight:800;font-size:15px;letter-spacing:-.005em;line-height:1.2;box-shadow:var(--shadow)}
.tag small{display:block;font-family:var(--f-mono);font-weight:500;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;opacity:.72;margin-bottom:2px}
.tag em{display:block;font-style:normal;font-family:var(--f-body);font-weight:700;font-size:12px;opacity:.8;margin-top:2px}
.tag.ok{background:var(--good);color:var(--on-good)}
.chip{position:absolute;left:0;top:0;pointer-events:none;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:12.5px;font-weight:700;box-shadow:var(--shadow);white-space:nowrap}
.chip span{color:var(--muted);font-weight:400}
.vlang{position:absolute;top:12px;right:12px;z-index:6;box-shadow:var(--shadow)}
.scale{position:absolute;left:18px;bottom:16px;font-family:var(--f-mono);font-size:11px;color:var(--muted);pointer-events:none;font-variant-numeric:tabular-nums}
.scale i{display:block;height:7px;border:2px solid var(--ink);border-top:0;margin-bottom:5px;width:80px;transition:width .2s}
.hint{position:absolute;right:16px;bottom:14px;font-size:12px;color:var(--muted);pointer-events:none;text-align:right}
.water{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);z-index:5;display:flex;align-items:center;gap:10px;background:var(--surface);border:1.5px solid var(--accent);border-radius:999px;padding:8px 16px;box-shadow:var(--shadow);width:min(480px,calc(100% - 32px));font-size:13px;font-weight:700}
.water span{white-space:nowrap}
.water input{flex:1;min-width:0;accent-color:var(--accent);height:28px}

/* intro card over the stage */
.intro{position:absolute;left:24px;top:24px;width:min(410px,calc(100% - 48px));background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:24px;box-shadow:var(--shadow);z-index:4}
.intro .eb{font-family:var(--f-mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--stain)}
.intro h2{font-family:var(--f-display);font-weight:800;font-size:46px;letter-spacing:-.04em;line-height:1;margin:8px 0 12px}
html[lang="hi"] .intro h2{letter-spacing:0;line-height:1.15}
.intro p{margin:0 0 18px;font-size:16px;line-height:1.55;color:var(--ink)}
.intro .row{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 16px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.intro .meta{margin-top:16px;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);line-height:1.7}
.linkbtn{border:0;background:none;padding:0;margin-top:12px;color:var(--accent);font-weight:700;font-size:13.5px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}

/* quiz bar + result */
.quizbar{position:absolute;top:16px;left:50%;transform:translateX(-50%);width:min(540px,calc(100% - 150px));background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 16px;box-shadow:var(--shadow);text-align:center;z-index:4}
.quizbar .qn{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.quizbar .qq{font-family:var(--f-display);font-weight:800;font-size:20px;letter-spacing:-.01em;line-height:1.25;margin-top:3px;text-wrap:balance}
.quizbar .fb{font-size:14px;margin-top:6px;min-height:21px;color:var(--muted)}
.quizbar .fb.bad{color:var(--bad)} .quizbar .fb.good{color:var(--good);font-weight:700}
.quizbar.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(calc(-50% - 7px))}40%,80%{transform:translateX(calc(-50% + 7px))}}
.result{position:absolute;inset:0;display:grid;place-items:center;padding:16px;background:color-mix(in srgb,var(--bg) 55%,transparent);backdrop-filter:blur(3px);z-index:5}
.result .card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:28px;max-width:440px;width:100%;text-align:center;box-shadow:var(--shadow)}
.stars{display:flex;justify-content:center;gap:6px;color:var(--line)}
.stars .on{color:var(--star)}
.result h3{font-family:var(--f-display);font-weight:800;font-size:32px;letter-spacing:-.02em;margin:10px 0 6px;line-height:1.15}
.result p{margin:0 0 18px;color:var(--muted)}
.result .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}

/* notebook panel */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:22px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.ph{padding:20px 22px 0}
.eyebrow{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--stain)}
.ph h2{font-family:var(--f-display);font-size:32px;font-weight:800;letter-spacing:-.03em;margin:4px 0 8px;line-height:1.05;text-wrap:balance}
html[lang="hi"] .ph h2{letter-spacing:0;line-height:1.2}
.ph .en{display:block;font-family:var(--f-body);font-size:13px;font-weight:700;color:var(--muted);margin:-4px 0 8px;letter-spacing:0}
.city{display:inline-flex;gap:8px;align-items:center;font-size:13px;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:4px 11px 4px 8px}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);padding:0 16px;margin-top:16px}
.tab{background:none;border:0;padding:10px 8px;font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);border-bottom:2px solid transparent;cursor:pointer;margin-bottom:-1px}
html[lang="hi"] .tab,html[lang="hi"] .eyebrow,html[lang="hi"] .intro .eb,html[lang="hi"] .prog .lbl,html[lang="hi"] .brand small,html[lang="hi"] .ch .n,html[lang="hi"] .callout b,html[lang="hi"] .quizbar .qn,html[lang="hi"] .intro .meta,html[lang="hi"] .tag small,html[lang="hi"] .menu .n{letter-spacing:.02em;font-size:12.5px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.pb{padding:16px 22px 22px;overflow:auto;min-height:0;flex:1}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.st{border:1px solid var(--line);border-radius:14px;padding:11px 13px;display:grid;grid-template-columns:24px minmax(0,1fr);gap:11px;cursor:pointer;background:transparent;text-align:left;width:100%}
.st:hover{background:var(--surface-2)}
.st .dot{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.st.done .dot{background:var(--good);border-color:var(--good);color:var(--on-good)}
.st.cur{border-color:var(--accent);background:var(--accent-soft)}
.st.cur .dot{border-color:var(--accent);color:var(--accent)}
.st .t{font-family:var(--f-display);font-weight:800;font-size:16.5px;line-height:1.3;letter-spacing:-.01em;padding-top:1px}
.st p{margin:6px 0 0;font-size:15.5px;line-height:1.6}
.auto{height:3px;background:var(--line);border-radius:3px;margin-top:12px;overflow:hidden}
.auto i{display:block;height:100%;width:0;background:var(--accent)}
.prose p{font-size:16px;line-height:1.65;margin:0 0 12px;max-width:62ch}
.callout{border:1.5px dashed var(--accent);border-radius:14px;padding:12px 14px;margin-top:6px;background:var(--accent-soft)}
.callout b{font-family:var(--f-mono);font-size:10.5px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);display:block;margin-bottom:3px}
.callout p{margin:0;font-size:15px}
.wow{font-family:var(--f-display);font-size:23px;font-weight:600;line-height:1.3;letter-spacing:-.015em;margin:4px 0 14px;text-wrap:pretty}
html[lang="hi"] .wow{letter-spacing:0;font-size:21px;line-height:1.5}
.small{font-size:13px;color:var(--muted)}
.tblwrap{overflow-x:auto;margin-bottom:12px}
.sheet{width:100%;border-collapse:collapse;font-size:14px}
.sheet th{text-align:left;font-family:var(--f-mono);font-weight:500;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:6px 4px;border-bottom:1.5px solid var(--line)}
.sheet td{padding:7px 4px;border-bottom:1px solid var(--line);vertical-align:top}
.sheet td:first-child{font-weight:700;padding-right:10px}
.sheet td:last-child{color:var(--muted)}
.qs .st{cursor:default}
.qs .st.miss .dot{border-color:var(--bad);color:var(--bad)}

/* chapter strip */
.chapters{display:flex;align-items:center;gap:10px;min-width:0}
.strip{display:flex;gap:8px;overflow-x:auto;flex:1;min-width:0;padding:2px;scrollbar-width:thin}
.ch{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:7px 14px 7px 7px;border:1px solid var(--line);background:var(--surface);border-radius:14px;cursor:pointer;text-align:left;min-width:158px}
.ch:hover{background:var(--surface-2)}
.ch .ic{width:38px;height:38px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;color:var(--accent);flex:0 0 auto}
.ch .n{font-family:var(--f-mono);font-size:10px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
.ch .nm{font-family:var(--f-display);font-weight:800;font-size:14px;line-height:1.2;letter-spacing:-.01em}
.ch.cur{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.ch.done .ic{background:var(--good);color:var(--on-good)}
.nav{width:46px;height:46px;flex:0 0 auto;border-radius:14px;border:1px solid var(--line);background:var(--surface);cursor:pointer;display:grid;place-items:center}
.nav.next{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.nav:disabled{opacity:.35;cursor:default}

@media (max-width:900px){
  html,body{height:auto}
  .app{display:flex;flex-direction:column;height:auto}
  .stage{display:contents}
  .top{order:1}
  .viewport{order:2;height:64vh;min-height:400px}
  .chapters{order:3}
  .panel{order:4;overflow:visible}
  .prog{min-width:0;flex:1 1 200px}
  .brand h1{font-size:24px}
  .brand{width:100%}
  .top>.lang{display:none}
  .intro{left:12px;right:12px;top:auto;bottom:12px;width:auto;padding:18px}
  .intro h2{font-size:34px}
  .intro p{font-size:15px;margin-bottom:14px}
  .hint{display:none}
  .ph h2{font-size:28px}
  .quizbar{top:60px;width:calc(100% - 24px)}
  .water{bottom:12px;padding:8px 12px;font-size:12px}
}
@media (min-width:901px){ .vlang{display:none} }
@media (prefers-reduced-motion: reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <div class="brand">
      <svg width="44" height="44" viewBox="0 0 44 44" aria-hidden="true">
        <circle cx="22" cy="22" r="19" fill="none" stroke="var(--stain)" stroke-width="3"/>

      return {n,s:b('Lysosome · autophagy','लाइसोसोम · ऑटोफ़ैजी'),en:b('Lysosome','Lysosome'),at:lysos[0].position}}};

 {name:b('Cell membrane','कोशिका झिल्ली'),city:b('The city wall','शहर की दीवार'),icon:'mem',steps:[
  {t:b('Wrap it in a membrane','झिल्ली से लपेटें'),show:['membrane'],focus:'membrane',cam:view(O,38,24,34),label:{k:'membrane',at:()=>sph(345,20,R)},
   x:b('Every cell starts with a boundary. The cell membrane is a soft, oily skin that wraps the whole cell and keeps the inside in.','हर कोशिका की एक सीमा होती है। कोशिका झिल्ली (cell membrane) एक मुलायम, तैलीय परत है जो पूरी कोशिका को लपेटकर अंदर की चीज़ों को अंदर रखती है।'),
   why:b(['The membrane is made of fat molecules called phospholipids. Their heads like water and their tails avoid it, so they line up tail-to-tail and form a double layer all by themselves.','Look at the cut edge: pink heads on the outside and inside, yellow tails hiding in the middle. That sandwich is called the lipid bilayer.'],
     ['झिल्ली वसा के अणुओं से बनी है जिन्हें फ़ॉस्फ़ोलिपिड (phospholipid) कहते हैं। इनका सिर पानी पसंद करता है और पूँछ पानी से दूर रहती है, इसलिए ये अपने आप पूँछ-से-पूँछ मिलाकर दोहरी परत बना लेते हैं।','कटे किनारे को देखिए: बाहर और अंदर गुलाबी सिर, बीच में छिपी पीली पूँछें। इस सैंडविच को लिपिड बाइलेयर (lipid bilayer) कहते हैं।']),
   wow:b('The membrane is only about 8 nanometres thick. You would need to stack more than 10,000 of them to match one sheet of paper.','झिल्ली सिर्फ़ लगभग 8 नैनोमीटर मोटी होती है। कागज़ की एक शीट जितनी मोटाई के लिए 10,000 से ज़्यादा झिल्लियाँ एक के ऊपर एक रखनी पड़ेंगी।')},
  {t:b('Add the gates','द्वार लगाएँ'),show:['channels'],focus:'channels',fx:'transport',cam:view(sph(338,12,R),352,14,8.5),label:{k:'channels',at:()=>sph(338,12,R+.25)},
   x:b('Proteins poke right through the membrane. They work like guarded gates, letting water and food in and sending waste out.','प्रोटीन झिल्ली के आर-पार निकले होते हैं। ये पहरेदार वाले द्वार की तरह काम करते हैं: पानी और भोजन को अंदर आने देते हैं और कचरे को बाहर भेजते हैं।'),
   why:b(['Tiny molecules like oxygen slip straight through the fat layer. Bigger ones, like glucose (sugar), need a protein gate.','Because the membrane chooses what passes, we call it selectively permeable. The green dots here are glucose and the blue ones are water.'],
     ['ऑक्सीजन जैसे छोटे अणु सीधे वसा की परत से निकल जाते हैं। ग्लूकोज़ (शक्कर) जैसे बड़े अणुओं को प्रोटीन द्वार चाहिए।','क्योंकि झिल्ली खुद चुनती है कि क्या अंदर जाए, इसे वरणात्मक पारगम्य (selectively permeable) कहते हैं। यहाँ हरे बिंदु ग्लूकोज़ हैं और नीले बिंदु पानी।']),
   exam:b('Selectively permeable = lets some substances through and stops others. NCERT asks this a lot.','वरणात्मक पारगम्य (selectively permeable) = कुछ पदार्थों को जाने देती है और कुछ को रोकती है। NCERT में यह अक्सर पूछा जाता है।'),
   wow:b('Put a raisin in water and it swells up. That is water rushing in through membranes, a process called osmosis.','किशमिश को पानी में रखो तो वह फूल जाती है। यह पानी के झिल्लियों से होकर अंदर जाने के कारण होता है, जिसे परासरण (osmosis) कहते हैं।')}
 ]},
 {name:b('Cytoplasm','कोशिका द्रव्य'),city:b('Streets and railways','सड़कें और रेल'),icon:'cyt',steps:[

   x:b('Pour in cytoplasm, a jelly-like liquid that fills the cell. Every other part will float in it.','कोशिका द्रव्य (cytoplasm) डालिए, एक जेली जैसा तरल जो पूरी कोशिका को भरता है। बाकी सारे हिस्से इसी में तैरेंगे।'),
   why:b(['Cytoplasm is mostly water, mixed with salts, sugars and proteins. Thousands of chemical reactions happen in it every second.','Think of it as a busy market square rather than still water.'],
     ['कोशिका द्रव्य ज़्यादातर पानी है, जिसमें लवण, शक्कर और प्रोटीन घुले होते हैं। इसमें हर सेकंड हज़ारों रासायनिक क्रियाएँ होती हैं।','इसे शांत पानी नहीं, बल्कि एक भीड़-भाड़ वाला बाज़ार समझिए।']),
   wow:b('Nothing in a cell sits still. The tiny dots you see are always jiggling and bumping, and that is how molecules find each other.','कोशिका में कुछ भी स्थिर नहीं बैठता। ये छोटे बिंदु लगातार हिलते और टकराते रहते हैं, और इसी तरह अणु एक-दूसरे को ढूँढ़ते हैं।')},
  {t:b('Put up the scaffolding','ढाँचा खड़ा करें'),show:['cyto'],focus:'cyto',cam:view(O,52,30,25),label:{k:'cyto',at:()=>fibers[0].getPoint(.62)},
   x:b('Thin protein fibres criss-cross the cell. This cytoskeleton holds the cell in shape and works like a railway for moving cargo.','पतले प्रोटीन रेशे पूरी कोशिका में फैले होते हैं। यह कोशिका कंकाल (cytoskeleton) कोशिका का आकार बनाए रखता है और सामान ढोने के लिए रेल की पटरी की तरह काम करता है।'),

     ['ये रेशे केन्द्रक के पास के एक केंद्र से निकलते हैं जिसे तारककाय (centrosome) कहते हैं।','मोटर प्रोटीन इन रेशों पर पैकेट लेकर चलते हैं, जैसे पटरियों पर रेलगाड़ी। रेशे कुछ ही मिनटों में खुलकर दोबारा बन सकते हैं।']),
   wow:b('Motor proteins really do take steps. One of them, kinesin, walks on two "feet", moving about 8 nanometres with every step.','मोटर प्रोटीन सच में कदम बढ़ाते हैं। काइनेसिन (kinesin) नाम का प्रोटीन दो "पैरों" पर चलता है और हर कदम में लगभग 8 नैनोमीटर आगे बढ़ता है।')}
 ]},
 {name:b('Nucleus','केन्द्रक'),city:b('City hall','नगर भवन'),icon:'nuc',steps:[
  {t:b('Drop in the nucleus','केन्द्रक रखें'),show:['nucleus'],focus:'nucleus',cam:view(O,45,22,14),label:{k:'nucleus',at:()=>sph(325,20,NR)},
   x:b('The nucleus is the control room. It is the biggest part of the cell and has its own double wall, called the nuclear envelope.','केन्द्रक (nucleus) कोशिका का कंट्रोल रूम है। यह कोशिका का सबसे बड़ा हिस्सा है और इसकी अपनी दोहरी दीवार होती है, जिसे केन्द्रक झिल्ली (nuclear envelope) कहते हैं।'),
   why:b(['The envelope is dotted with holes called nuclear pores. Messages travel out through the pores and tell the rest of the cell what to build.','Cells with a proper nucleus, like yours, are called eukaryotic. Bacteria have no nucleus, so they are prokaryotic.'],
     ['इस झिल्ली में छेद होते हैं जिन्हें केन्द्रक छिद्र (nuclear pores) कहते हैं। संदेश इन्हीं छिद्रों से बाहर जाकर बाकी कोशिका को बताते हैं कि क्या बनाना है।','आपकी कोशिकाओं की तरह जिनमें असली केन्द्रक होता है, उन्हें यूकैरियोटिक (eukaryotic) कहते हैं। बैक्टीरिया में केन्द्रक नहीं होता, इसलिए वे प्रोकैरियोटिक (prokaryotic) हैं।']),
   exam:b('Eukaryote = has a nucleus with a membrane. Prokaryote (bacteria) = no nuclear membrane.','यूकैरियोट (eukaryote) = झिल्ली से घिरा केन्द्रक होता है। प्रोकैरियोट (prokaryote, बैक्टीरिया) = केन्द्रक झिल्ली नहीं होती।'),
   wow:b('One nucleus can have thousands of pores, and each one checks every molecule that tries to pass.','एक केन्द्रक में हज़ारों छिद्र हो सकते हैं, और हर छिद्र अंदर-बाहर जाने वाले हर अणु की जाँच करता है।')},
  {t:b('Unpack the DNA','DNA खोलें'),show:['chromatin'],focus:'chromatin',cam:view(O,45,30,9.5),label:{k:'chromatin',at:()=>strands[0].getPoint(.45)},
   x:b('Inside the nucleus is DNA, the instruction book for building and running your body. Here it is loosely packed as chromatin.','केन्द्रक के अंदर DNA होता है, आपके शरीर को बनाने और चलाने की निर्देश पुस्तिका। यहाँ यह ढीला लिपटा है और इसे क्रोमैटिन (chromatin) कहते हैं।'),
   why:b(['When a cell gets ready to divide, chromatin coils up tightly into chromosomes so it can be shared out evenly.','Human body cells have 46 chromosomes, arranged in 23 pairs.'],
     ['जब कोशिका विभाजन की तैयारी करती है, तो क्रोमैटिन कसकर लिपटकर गुणसूत्र (chromosomes) बन जाता है, ताकि इसे बराबर बाँटा जा सके।','मनुष्य की शरीर कोशिकाओं में 46 गुणसूत्र होते हैं, जो 23 जोड़ियों में होते हैं।']),
   exam:b('Chromatin = loose DNA and protein. Chromosomes = chromatin coiled up tight, seen during cell division.','क्रोमैटिन (chromatin) = ढीला DNA और प्रोटीन। गुणसूत्र (chromosomes) = कसकर लिपटा क्रोमैटिन, जो कोशिका विभाजन के समय दिखता है।'),
   wow:b('Stretch out the DNA from just one of your cells and it would be about 2 metres long. It fits in a nucleus far smaller than a grain of sand.','आपकी सिर्फ़ एक कोशिका का DNA खींचकर सीधा करें तो वह लगभग 2 मीटर लंबा होगा। फिर भी यह रेत के एक दाने से भी बहुत छोटे केन्द्रक में समा जाता है।')},
  {t:b('Find the nucleolus','केन्द्रिका ढूँढ़ें'),show:['nucleolus'],focus:'nucleolus',cam:view(POS.nucleolus,45,24,7),label:{k:'nucleolus',at:()=>POS.nucleolus},
   x:b('The dark ball inside the nucleus is the nucleolus. It makes the parts for ribosomes, the cell\'s tiny builders.','केन्द्रक के अंदर की गहरी गेंद केन्द्रिका (nucleolus) है। यह राइबोसोम के पुर्ज़े बनाती है, जो कोशिका के नन्हे कारीगर हैं।'),
   why:b(['Ribosome parts are made here, then pushed out through the nuclear pores and put together in the cytoplasm.'],['राइबोसोम के पुर्ज़े यहाँ बनते हैं, फिर केन्द्रक छिद्रों से बाहर निकलकर कोशिका द्रव्य में जोड़े जाते हैं।']),
   wow:b('Cells that make a lot of protein often have extra-large nucleoli, because they need so many ribosomes.','जो कोशिकाएँ बहुत ज़्यादा प्रोटीन बनाती हैं, उनमें अक्सर केन्द्रिका बहुत बड़ी होती है, क्योंकि उन्हें ढेर सारे राइबोसोम चाहिए।')}
 ]},
 {name:b('Ribosomes & ER','राइबोसोम और ER'),city:b('The factories','कारखाने'),icon:'er',steps:[
  {t:b('Scatter the ribosomes','राइबोसोम बिखेरें'),show:['ribosomes'],focus:'ribosomes',cam:view(POS.polysome,40,16,6),label:{k:'ribosomes',at:()=>POS.polysome},
   x:b('Ribosomes are tiny machines that build proteins. They read the instructions sent from the nucleus and join amino acids together, one by one, like beads on a string.','राइबोसोम (ribosome) छोटी मशीनें हैं जो प्रोटीन बनाती हैं। ये केन्द्रक से आए निर्देश पढ़ती हैं और अमीनो अम्लों को एक-एक करके जोड़ती हैं, जैसे धागे में मोती।'),

   x:b('The endoplasmic reticulum (ER) is a maze of folded membranes joined to the nucleus. Rough ER is covered in ribosomes, which make it look bumpy.','अंतर्द्रव्यी जालिका (endoplasmic reticulum, ER) मुड़ी हुई झिल्लियों का एक जाल है जो केन्द्रक से जुड़ा होता है। खुरदरी ER (rough ER) पर राइबोसोम चिपके होते हैं, इसलिए यह ऊबड़-खाबड़ दिखती है।'),

 {name:b('Golgi apparatus','गॉल्जी उपकरण'),city:b('The post office','डाकघर'),icon:'gol',steps:[

   x:b('Plant cells never live alone. They sit side by side like bricks, glued together, and tiny tunnels called plasmodesmata pass through the walls to link them.','पादप कोशिकाएँ कभी अकेली नहीं रहतीं। ये ईंटों की तरह एक-दूसरे से सटी और चिपकी रहती हैं, और प्लाज़्मोडेस्मेटा (plasmodesmata) नाम की छोटी सुरंगें भित्तियों के आर-पार जाकर उन्हें जोड़ती हैं।'),
   why:b(['The glue between two walls is a thin layer called the middle lamella. It is made of pectin, the same substance that helps jam set.','Water, sugars and messages flow from cell to cell through the plasmodesmata, so a whole leaf works as a team.'],
     ['दो भित्तियों के बीच की गोंद एक पतली परत है जिसे मध्य पटलिका (middle lamella) कहते हैं। यह पेक्टिन (pectin) से बनी है, वही पदार्थ जो जैम को जमाने में मदद करता है।','पानी, शक्कर और संदेश प्लाज़्मोडेस्मेटा से होकर एक कोशिका से दूसरी में जाते हैं, ताकि पूरी पत्ती एक टीम की तरह काम करे।']),
   wow:b('A single leaf is made of millions of cells, all linked through these tunnels.','एक अकेली पत्ती लाखों कोशिकाओं से बनी होती है, जो सब इन सुरंगों से जुड़ी हैं।')}
 ]},
 {name:b('Membrane & cytoplasm','झिल्ली और कोशिका द्रव्य'),city:b('The inner fence','भीतरी बाड़'),icon:'mem',steps:[
  {t:b('Line it with a membrane','अंदर झिल्ली लगाएँ'),show:['membrane','cytoplasm'],focus:'membrane',cam:view(O,72,18,40),label:{k:'membrane',at:()=>new V(-4,MB,0)},
   x:b('Just inside the wall sits a cell membrane, exactly like the one in Lesson 1. It hugs the wall from the inside and holds the cytoplasm.','भित्ति के ठीक अंदर एक कोशिका झिल्ली होती है, बिल्कुल पाठ 1 जैसी। यह अंदर से भित्ति से चिपकी रहती है और कोशिका द्रव्य को थामे रखती है।'),
   why:b(['The wall is a tough outer box. The membrane is the real gatekeeper that decides what enters.','Everything inside the membrane, the cytoplasm plus all the organelles, is called the protoplast.'],
     ['भित्ति एक मज़बूत बाहरी डिब्बा है। असली पहरेदार झिल्ली है जो तय करती है कि अंदर क्या जाएगा।','झिल्ली के अंदर की हर चीज़, यानी कोशिका द्रव्य और सारे अंगक, मिलकर जीवद्रव्यक (protoplast) कहलाते हैं।']),
   wow:b('Notice how thin the layer of cytoplasm is. Something huge is about to take over the middle of this cell.','देखिए कोशिका द्रव्य की परत कितनी पतली है। इस कोशिका के बीच की जगह जल्द ही किसी बहुत बड़ी चीज़ से भरने वाली है।')}
 ]},
 {name:b('Vacuole','रिक्तिका'),city:b('The water tank','पानी की टंकी'),icon:'vac',steps:[
  {t:b('Fill the central vacuole','केंद्रीय रिक्तिका भरें'),show:['vacuole'],focus:'vacuole',cam:view(O,74,18,38),label:{k:'vacuole',at:()=>new V(3,1,0)},
   x:b('The big bubble in the middle is the central vacuole. It is a storage tank full of water, sugars, salts and waste, and it can fill up to 90% of the cell.','बीच का बड़ा बुलबुला केंद्रीय रिक्तिका (central vacuole) है। यह पानी, शक्कर, लवण और अपशिष्ट से भरी एक भंडार टंकी है, और कोशिका का 90% तक हिस्सा घेर सकती है।'),
   why:b(['The vacuole has its own membrane, called the tonoplast.','Because the vacuole is so big, it pushes the cytoplasm, nucleus and chloroplasts into a thin layer against the wall, close to the light.'],
     ['रिक्तिका की अपनी झिल्ली होती है जिसे टोनोप्लास्ट (tonoplast) कहते हैं।','रिक्तिका इतनी बड़ी है कि यह कोशिका द्रव्य, केन्द्रक और हरितलवकों को धकेलकर भित्ति के पास एक पतली परत में कर देती है, रोशनी के पास।']),
   exam:b('Plant cells have one large central vacuole. Animal cells have small vacuoles, or none.','पादप कोशिका में एक बड़ी केंद्रीय रिक्तिका होती है। जंतु कोशिका में रिक्तिकाएँ छोटी होती हैं, या होती ही नहीं।'),
   wow:b('The deep red of beetroot comes from pigment dissolved in the vacuoles of its cells.','चुकंदर का गहरा लाल रंग उसकी कोशिकाओं की रिक्तिकाओं में घुले रंजक से आता है।')},
  {t:b('Water in, water out','पानी अंदर, पानी बाहर'),ctrl:'water',focus:'vacuole',fx:'water',dur:20,cam:view(O,80,16,40),label:{dyn:'water'},
   x:b('Drag the slider. In fresh water, the vacuole swells and presses the cell against its wall. In salty water, water leaves, and the inside shrinks away from the wall.','स्लाइडर खिसकाइए। साफ़ पानी में रिक्तिका फूलती है और कोशिका को भित्ति से दबा देती है। नमकीन पानी में पानी बाहर निकलता है और अंदर का हिस्सा भित्ति से दूर सिकुड़ जाता है।'),
   why:b(['Water moves by osmosis, from where there is more water to where there is less. Watch the blue dots.','A cell full of water is turgid, and that pressure keeps leaves and stems firm. A cell that loses water and pulls away from its wall is plasmolysed, and the plant wilts.'],
     ['पानी परासरण (osmosis) से चलता है, जहाँ पानी ज़्यादा है वहाँ से जहाँ कम है वहाँ की ओर। नीले बिंदुओं को देखिए।','पानी से भरी कोशिका स्फीत (turgid) होती है, और यही दबाव पत्तियों और तनों को कड़क रखता है। जो कोशिका पानी खोकर भित्ति से दूर सिकुड़ जाए वह जीवद्रव्यकुंचित (plasmolysed) होती है, और पौधा मुरझा जाता है।']),
   exam:b('Plasmolysis = the protoplast shrinking away from the cell wall when water leaves by osmosis. NCERT shows it with a Rhoeo leaf peel in salt solution.','जीवद्रव्यकुंचन (plasmolysis) = परासरण से पानी निकलने पर जीवद्रव्यक का कोशिका भित्ति से दूर सिकुड़ जाना। NCERT में इसे नमक के घोल में रखी रोईओ (Rhoeo) पत्ती की झिल्ली से दिखाया गया है।'),
   wow:b('Put an animal cell in fresh water and it can swell until it bursts. A plant cell doesn\'t burst, because its wall pushes back.','जंतु कोशिका को साफ़ पानी में रखो तो वह फूलकर फट सकती है। पादप कोशिका नहीं फटती, क्योंकि उसकी भित्ति वापस धक्का देती है।')}
 ]},
 {name:b('Chloroplasts','हरितलवक'),city:b('Solar kitchens','सौर रसोई'),icon:'chl',steps:[
  {t:b('Add the chloroplasts','हरितलवक जोड़ें'),show:['chloro'],focus:'chloro',fx:'sun',cam:view(O,70,24,38),label:{k:'chloro',at:()=>statics[0]},
   x:b('Chloroplasts are green food factories. They catch sunlight and use it to turn carbon dioxide and water into sugar. This is photosynthesis.','हरितलवक (chloroplast) हरे रंग के भोजन के कारखाने हैं। ये सूरज की रोशनी पकड़कर कार्बन डाइऑक्साइड और पानी को शक्कर में बदलते हैं। इसे प्रकाश संश्लेषण (photosynthesis) कहते हैं।'),
   why:b(['Carbon dioxide + water → glucose + oxygen, powered by sunlight and chlorophyll. The orange sparks are sugar being made.','Chlorophyll is the green pigment. It absorbs red and blue light and reflects green, which is why leaves look green.'],
     ['कार्बन डाइऑक्साइड + पानी → ग्लूकोज़ + ऑक्सीजन, सूरज की रोशनी और क्लोरोफ़िल की मदद से। नारंगी चिंगारियाँ बनती हुई शक्कर हैं।','क्लोरोफ़िल (chlorophyll) हरा रंजक है। यह लाल और नीली रोशनी सोखता है और हरी लौटा देता है, इसीलिए पत्तियाँ हरी दिखती हैं।']),
   exam:b('Chloroplasts are one kind of plastid. Chromoplasts give colour to flowers and fruits. Leucoplasts store starch, oil and protein.','हरितलवक एक तरह का लवक (plastid) है। वर्णीलवक (chromoplasts) फूलों और फलों को रंग देते हैं। अवर्णीलवक (leucoplasts) स्टार्च, तेल और प्रोटीन जमा करते हैं।'),
   wow:b('Almost all the oxygen you breathe was released by photosynthesis in plants and tiny ocean algae.','आप जो ऑक्सीजन साँस में लेते हैं, उसका लगभग सारा हिस्सा पौधों और समुद्र के सूक्ष्म शैवालों के प्रकाश संश्लेषण से आया है।')},
  {t:b('Look inside one','एक को अंदर से देखें'),show:['chloroHero'],focus:'chloroHero',cam:view(HP,84,22,7.5),label:{n:b('Grana','ग्रैना'),s:b('stacks of thylakoids','थाइलेकॉइड के ढेर'),en:b('Grana','Grana'),at:()=>HP.clone().add(new V(-.68,.25,-.3))},
   x:b('Slice a chloroplast open. Inside are stacks of flat green discs, piled up like coins. Each stack is a granum, and each disc is a thylakoid.','एक हरितलवक को काटकर खोलिए। अंदर सिक्कों की तरह जमी चपटी हरी चकतियों के ढेर हैं। हर ढेर एक ग्रैनम (granum) है, और हर चकती एक थाइलेकॉइड (thylakoid)।'),
   why:b(['Chlorophyll sits in the thylakoid membranes. Stacking them packs in more light-catching surface.','The fluid around the stacks is the stroma. That is where carbon dioxide is actually built into sugar. The white grain is stored starch.'],
     ['क्लोरोफ़िल थाइलेकॉइड झिल्लियों में होता है। इन्हें ढेर में जमाने से रोशनी पकड़ने की ज़्यादा सतह मिलती है।','ढेरों के चारों ओर का तरल पीठिका (stroma) है। असल में यहीं कार्बन डाइऑक्साइड से शक्कर बनती है। सफ़ेद दाना जमा किया हुआ स्टार्च है।']),
   wow:b('Like mitochondria, chloroplasts have their own DNA (the pink loop). Scientists think both were once free-living bacteria that moved into bigger cells long ago.','माइटोकॉन्ड्रिया की तरह हरितलवक का भी अपना DNA होता है (गुलाबी छल्ला)। वैज्ञानिक मानते हैं कि दोनों कभी आज़ाद रहने वाले बैक्टीरिया थे जो बहुत पहले बड़ी कोशिकाओं में आकर बस गए।')},
  {t:b('Watch them stream','इन्हें बहते देखें'),focus:'chloro',fx:'stream',cam:view(O,76,14,34),label:{dyn:'stream'},
   x:b('The cytoplasm in a plant cell flows around the vacuole like a slow river, carrying the chloroplasts with it. This is called cytoplasmic streaming.','पादप कोशिका का कोशिका द्रव्य रिक्तिका के चारों ओर धीमी नदी की तरह बहता है और हरितलवकों को साथ ले जाता है। इसे कोशिका द्रव्य प्रवाह (cytoplasmic streaming) कहते हैं।'),
   why:b(['Streaming moves food, chloroplasts and other parts around a big cell much faster than they could drift on their own.','You can see it yourself under a school microscope in a leaf of Hydrilla, a common pond plant.'],
     ['यह प्रवाह भोजन, हरितलवक और दूसरे हिस्सों को बड़ी कोशिका में उससे कहीं तेज़ी से पहुँचाता है जितना वे खुद तैरकर पहुँचते।','आप इसे स्कूल के माइक्रोस्कोप में हाइड्रिला (Hydrilla) की पत्ती में खुद देख सकते हैं, जो तालाब का एक आम पौधा है।']),
   wow:b('In the giant cells of the alga Chara, the cytoplasm streams at up to 100 micrometres per second. That would cross a cell like this one in about half a second.','शैवाल कारा (Chara) की विशाल कोशिकाओं में कोशिका द्रव्य 100 माइक्रोमीटर प्रति सेकंड तक की रफ़्तार से बहता है। इस रफ़्तार से यह इस जैसी कोशिका को लगभग आधे सेकंड में पार कर ले।')}
 ]},
 {name:b('Familiar parts','जाने-पहचाने हिस्से'),city:b('The same city services','वही नगर सेवाएँ'),icon:'nuc',steps:[
  {t:b('The rest of the city','शहर का बाकी हिस्सा'),show:['nucleus','mito','golgi','er'],focus:'nucleus',cam:view(NP,62,18,16),label:{k:'nucleus',s:b('pushed to the side','एक तरफ़ धकेला गया'),at:()=>NP.clone().add(new V(.6,1.2,.6))},
   x:b('Plant cells also have a nucleus, mitochondria, a Golgi apparatus, ER and ribosomes. The vacuole pushes the nucleus off to one side.','पादप कोशिका में भी केन्द्रक, माइटोकॉन्ड्रिया, गॉल्जी उपकरण, ER और राइबोसोम होते हैं। रिक्तिका केन्द्रक को एक तरफ़ धकेल देती है।'),
   why:b(['Plants make their own food in chloroplasts, but they still need mitochondria to turn that food into ATP.','So plants respire too. They respire all day and all night, and photosynthesise only when there is light.'],
     ['पौधे हरितलवकों में अपना भोजन खुद बनाते हैं, लेकिन उस भोजन को ATP में बदलने के लिए उन्हें भी माइटोकॉन्ड्रिया चाहिए।','यानी पौधे भी श्वसन करते हैं। वे दिन-रात श्वसन करते हैं, और प्रकाश संश्लेषण सिर्फ़ रोशनी होने पर करते हैं।']),
   exam:b('Plant cells have BOTH chloroplasts and mitochondria. A common wrong answer says plants have no mitochondria.','पादप कोशिका में हरितलवक और माइटोकॉन्ड्रिया दोनों होते हैं। एक आम गलत उत्तर है कि पौधों में माइटोकॉन्ड्रिया नहीं होते।'),
   wow:b('Most plant cells have no centrioles, which animal cells use when they divide. Plants divide perfectly well without them.','ज़्यादातर पादप कोशिकाओं में तारककेंद्र (centrioles) नहीं होते, जिनका इस्तेमाल जंतु कोशिकाएँ विभाजन में करती हैं। पौधे इनके बिना भी अच्छी तरह विभाजन कर लेते हैं।')}
 ]},
 {name:b('Plant vs animal','पादप बनाम जंतु'),city:b('Spot the difference','अंतर पहचानें'),icon:'cmp',steps:[
  {t:b('Three plant superpowers','पौधों की तीन महाशक्तियाँ'),focus:['wall','chloro','vacuole'],cam:view(O,70,22,42),
   x:b('The glowing parts are what make this a plant cell: the cell wall, the chloroplasts and the large central vacuole. Animal cells don\'t have them.','चमकते हिस्से ही इसे पादप कोशिका बनाते हैं: कोशिका भित्ति, हरितलवक और बड़ी केंद्रीय रिक्तिका। जंतु कोशिकाओं में ये नहीं होते।'),
   table:[[b('Cell wall','कोशिका भित्ति'),b('Yes, cellulose','हाँ, सेलुलोज़'),b('No','नहीं')],[b('Shape','आकार'),b('Fixed, box-like','स्थिर, डिब्बे जैसा'),b('Rounded, can change','गोल, बदल सकता है')],
     [b('Vacuole','रिक्तिका'),b('One large, central','एक बड़ी, केंद्र में'),b('Small or none','छोटी या नहीं')],[b('Chloroplasts','हरितलवक'),b('Yes','हाँ'),b('No','नहीं')],
     [b('Centrioles','तारककेंद्र'),b('Usually absent','आमतौर पर नहीं'),b('Present','होते हैं')],[b('Lysosomes','लाइसोसोम'),b('Rare','कम'),b('Common','आम')]],
   why:b([],[]),
   exam:b('This comparison table is a favourite exam question. Learn the first four rows.','यह तुलना तालिका परीक्षा का पसंदीदा प्रश्न है। पहली चार पंक्तियाँ याद कर लीजिए।'),
   wow:b('Fungi have cell walls too, but theirs are made of chitin, the same material as insect shells.','कवक (fungi) में भी भित्ति होती है, लेकिन वह काइटिन (chitin) से बनी होती है, वही पदार्थ जिससे कीड़ों का कवच बनता है।')}
 ]},
 {name:b('Test yourself','खुद को परखें'),city:b('Become a city guide','शहर के गाइड बनें'),icon:'quiz',quiz:true,steps:[{t:b('Tap the right part','सही हिस्से पर टैप करें'),quiz:true,cam:view(O,72,22,42)}]}

   {q:b('Tap the giant water tank.','विशाल पानी की टंकी पर टैप करें।'),a:'vacuole'},

const ray=new THREE.Raycaster(),mouse=new THREE.Vector2();let hoverXY=null,downXY=null,dragging=false;

  let soft=null;

    if(LS.SOFT[k]){if(!soft||LS.SOFT[k]>LS.SOFT[soft.k])soft={k,p:h.point};continue}

  if(!L||!(now-st.stepT0>.9||st.temp)||fly){hideTag();return}
  const a=proj(L.at);if(!a.ok||a.x<0||a.x>W||a.y<0||a.y>H){hideTag();return}
  const enName=HI()&&L.en?EN(L.en):'';
  const html=`<small>${esc(T(L.s))}</small>${esc(T(L.n))}${enName&&enName!==T(L.n)?`<em lang="en">${esc(enName)}</em>`:''}`;
  if(html!==lastTagHTML){tag.innerHTML=html;lastTagHTML=html}
  tag.classList.toggle('ok',!!L.ok);tag.hidden=false;
  const tw=tag.offsetWidth,th=tag.offsetHeight,left=a.x>W*.58;
  let lx=left?a.x-tw-54:a.x+54,ly=a.y-th-46;lx=clamp(lx,10,W-tw-10);ly=clamp(ly,10,H-th-10);
  tag.style.transform=`translate(${lx}px,${ly}px)`;
  const ex=clamp(a.x,lx,lx+tw),ey=clamp(a.y,ly,ly+th);
  lLine.setAttribute('x1',a.x);lLine.setAttribute('y1',a.y);lLine.setAttribute('x2',ex);lLine.setAttribute('y2',ey);
  lRing.setAttribute('cx',a.x);lRing.setAttribute('cy',a.y);lCore.setAttribute('cx',a.x);lCore.setAttribute('cy',a.y);
  lLine.style.display=lRing.style.display=lCore.style.display=''}
function updateScale(){const d=camera.position.distanceTo(controls.target);const ppu=H/(2*d*Math.tan(camera.fov*D2R/2))/LS.unit;
  const opts=[.5,1,2,5,10,20,50];let L=opts[opts.length-1];for(const o of opts){if(o*ppu>=56){L=o;break}}
  $('#scaleBar').style.width=Math.round(L*ppu)+'px';$('#scaleTxt').textContent=L+' µm'}

/* ---------------- per-frame ---------------- */
function updateEntries(){
  for(const k in LS.ENT){const e=LS.ENT[k],el=now-e.t0;let any=false;
    e.parts.forEach((p,i)=>{let s;if(e.target){const l=clamp((el-i*e.stag)/e.dur,0,1);s=RM?l:easeOutBack(l)}else s=1-easeInCubic(clamp(el/.5,0,1));
      s=Math.max(s,1e-4);p.scale.copy(p.userData.base).multiplyScalar(s*p.userData.fx);if(s>.002)any=true});
    e.root.visible=any||(e.target===1&&el>-.4)}
  const s=st.intro?null:LS.STEPS[st.step];
  let fk=s&&!s.quiz?[].concat(s.focus||[]):[];
  if(st.quiz&&!st.quiz.over&&st.quiz.tries>=2)fk=[LS.QUIZ[st.quiz.i].a];
  for(const k in LS.ENT){const e=LS.ENT[k];const on=fk.indexOf(k)>=0&&now-st.stepT0>.5;const I=on?.2+.17*Math.sin(now*3.4):0;
    if(Math.abs(I-e.lastI)>.004){e.mats.forEach(m=>{m.emissive.copy(m.userData.glow);m.emissiveIntensity=I});e.lastI=I}}}
function updateAuto(){if(!st.playing||st.intro||st.quiz)return;const s=LS.STEPS[st.step];const d=(s.dur||12)/st.speed;const p=(now-st.stepT0)/d;
  const bb=document.getElementById('autoBar');if(bb)bb.style.width=Math.min(100,p*100)+'%';
  if(p>=1){if(st.step+1>=LS.QUIZ_STEP){setPlaying(false);goStep(LS.QUIZ_STEP)}else goStep(st.step+1)}}
function resize(){const r=viewport.getBoundingClientRect();W=Math.max(1,r.width);H=Math.max(1,r.height);renderer.setSize(W,H,false);camera.aspect=W/H;camera.updateProjectionMatrix()}
new ResizeObserver(resize).observe(viewport);resize();

const clock=new THREE.Clock();
function frame(){const dt=Math.min(.1,clock.getDelta());now+=dt;
  updateFly();updateEntries();
  const s=st.intro?null:LS.STEPS[st.step];LS.fx(s,dt,now-st.stepT0);updateAuto();
  controls.update();renderer.render(scene,camera);updateLabel();updateScale();updateHover();
  requestAnimationFrame(frame)}

/* boot */
const start=LESSONS.find(l=>'#'+l.id===location.hash)||L1;
LS=start;LS.root.visible=true;setTab('steps');showIntro(true);
frame();
